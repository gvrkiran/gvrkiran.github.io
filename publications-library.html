<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publications · Kiran Garimella</title>
  <meta name="description" content="Publications by Kiran Garimella." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,550;9..144,650&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/publications-library.css" />
</head>
<body>
  <a class="skip-link" href="#publications">Skip to publications</a>

  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span><span>Kiran Garimella</span></a>
    <nav class="topnav" aria-label="Publication views">
      <a href="index.html">Home</a>
      <a href="publications.html?pub=2">Orchard</a>
      <a href="publications.html?pub=3">Stamps</a>
      <a href="publications.html?pub=6">Cave</a>
      <a class="current" href="publications-library.html" aria-current="page">Publications</a>
      <a href="publications.html?reroll=1" title="Switch to a random design">Shuffle ↻</a>
    </nav>
  </header>

  <section class="masthead" aria-labelledby="pageTitle">
    <div>
      <h1 id="pageTitle">Publications</h1>
    </div>
    <dl class="library-stats" aria-label="Publication statistics">
      <div><dt>Publications</dt><dd id="totalStat">—</dd></div>
      <div><dt>Years</dt><dd id="shelfStat">—</dd></div>
    </dl>
  </section>

  <section class="catalog-bar" aria-label="Search and filter publications">
    <div class="catalog-inner">
      <div class="search-row">
        <label class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7" stroke="currentColor" stroke-width="1.6"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="search" type="search" autocomplete="off" placeholder="Find a title, author, venue, or year" aria-label="Search publications" />
          <span class="shortcut" aria-hidden="true">/</span>
        </label>
        <span class="result-count" id="resultCount" aria-live="polite"></span>
      </div>
      <nav class="chips" id="chips" aria-label="Filter by topic"></nav>
    </div>
  </section>

  <main class="wall" id="publications">
    <section class="arrivals" id="cartRow" aria-labelledby="arrivalsTitle">
      <div class="arrivals-copy">
        <h2 id="arrivalsTitle">Under review</h2>
      </div>
      <ol class="cart-list" id="cartList"></ol>
    </section>

    <div id="shelves"></div>
  </main>

  <div class="veil" id="veil" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="cardTitle">
    <article class="open-book">
      <button class="card-close" id="cardClose" aria-label="Close publication">×</button>
      <section class="page cover-page" aria-label="Publication cover">
        <p class="page-eyebrow" id="cardShelf"></p>
        <div class="modal-cover" id="cardArt"></div>
      </section>
      <section class="page details-page">
        <div class="chiprow" id="cardChips"></div>
        <h2 id="cardTitle"></h2>
        <p class="authors" id="cardAuthors"></p>
        <div class="rule"></div>
        <dl class="meta-grid" id="cardMeta"></dl>
        <div class="card-links" id="cardLinks"></div>
        <nav class="book-navigation" aria-label="Browse open publications">
          <button id="previousBook" aria-label="Previous publication">←</button>
          <span class="page-count" id="pageCount"></span>
          <button id="nextBook" aria-label="Next publication">→</button>
        </nav>
      </section>
    </article>
  </div>

  <script src="data.js"></script>
  <script src="js/publications-library.js"></script>
</body>
</html>
